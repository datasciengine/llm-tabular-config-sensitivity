seeds:
- 0
- 1
- 2
- 3
- 4
finetune_subsample_seed: 42
paths:
  data_dir: ./data
  results_dir: ./results_r23
  model_cache: ./results_r23/.model_cache
sample_size:
  mode: fixed
  n: 5000
  great_finetune_max_rows: 5000
datasets:
- name: diabetes
  source: Pima Indians Diabetes
  target: Outcome
  positive_class: 1
  problem_type: classification
  drop_for_tstr: []
config:
  baseline:
    serialization: sentence
    column_order: original
    numeric_format: raw
  axes:
    serialization:
    - keyvalue
    - compact
    column_order:
    - perm1
    - perm2
    - perm3
    numeric_format:
    - rounded
  numeric_format_rules:
    raw: source precision unchanged
    rounded: continuous cols -> 2 significant figures; integer cols stay integer
generators:
- name: icl
  kind: llm_icl
  env: env-llm
  base_model: Qwen2.5-3B-Instruct
  config_sensitive: true
  params:
    n_shots: 20
    temperature: 0.8
    chunk_size: 32
    max_oversample: 3
    gen_batch: 8
metrics:
- ks_marginal
- tvd_categorical
- corr_diff
- c2st_auc
- tstr
primary_fidelity_metric: ks_marginal
tstr:
  model: HistGradientBoostingClassifier
  model_params:
    random_state: 0
  score: roc_auc
  preprocessing: one-hot categoricals, standardize numerics; same pipeline real &
    synth
analysis:
  variance_components:
    scope: llm_generators_only
    factors:
    - generator
    - dataset
    - config
    - seed
    report: 'percent variance: config vs seed vs residual'
    controls_reported_as: seed-only floor (baseline across-seed std)
  ranking_stability:
  - kendall_w
  - rank_flip_rate
  - top1_flip_freq
  - p_wrong_single_run
  csi: true
  multiple_comparison_correction:
    method: holm
    families:
      config_effect: config-vs-baseline within each (llm_generator, dataset, metric)
      ranking: generator-pair comparisons within each (dataset, metric)
  bootstrap_ci:
    n: 1000
    level: 0.95
